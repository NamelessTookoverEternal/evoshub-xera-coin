# Netlify config for the EVOS Business Hub / XERA frontend.
#
# This is a monorepo — the frontend lives in hub-frontend/. When creating
# the Netlify site, either:
#   (a) point Netlify's "Base directory" at hub-frontend/ in the UI, or
#   (b) leave this file at the repo root as-is; Netlify reads `base` below
#       and applies build/publish paths relative to it automatically.
#
# Required environment variables (set in Netlify → Site settings →
# Environment variables — NOT committed here):
#   VITE_API_BASE_URL       e.g. https://evoshub.fly.dev  (your Fly.io app URL for this test round)
#   VITE_SUPABASE_URL       your Supabase project URL
#   VITE_SUPABASE_ANON_KEY  your Supabase anon/public key
#
# See hub-frontend/.env.example for local-dev equivalents, and
# DEPLOY_TESTING.md at the repo root for the first-deploy checklist.

[build]
  base = "hub-frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Vite emits one physical .html file per page (see vite.config.js) rather
# than a client-side-routed SPA, so these are just pretty-URL rewrites —
# not a catch-all SPA fallback. Mirrors hub-frontend/vercel.json exactly so
# the two hosts behave identically during side-by-side testing.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
