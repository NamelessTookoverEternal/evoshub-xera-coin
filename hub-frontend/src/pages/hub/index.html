<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#060810"/>
<meta name="description" content="EVOS HUB — your gateway to the EVOXERA ecosystem."/>
<title>EVOS HUB | EVOXERA TECHNOLOGY</title>
<script>(function(){try{var t=localStorage.getItem('evos_accent_theme');if(t&&t!=='default')document.documentElement.setAttribute('data-accent',t);}catch(e){}})();</script>
<link href="../../css/theme.css" rel="stylesheet"/>
<link href="../../css/hub.css" rel="stylesheet"/>
</head>
<body class="hub-body">

<div class="hub-shell">

  <aside class="hub-sidebar" id="hubSidebar" aria-label="EVOS Hub navigation"></aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header class="hub-topbar" id="hubTopbar"></header>

    <main class="hub-main hub-home">

      <!-- Greeting -->
      <section class="hh-greet" aria-label="Greeting">
        <p class="hh-greet-eyebrow">Welcome back</p>
        <h1 class="hh-greet-name">Hi, <span id="welcomeName">there</span> <span class="hh-wave" aria-hidden="true">&#128075;</span></h1>
      </section>

      <!-- One XERA status card. Balance and mining state are fetched, never invented. Tapping opens XERA. -->
      <a class="hh-xera" id="xeraStatusCard" href="/xera" data-state="loading" aria-label="Open XERA">
        <img class="hh-xera-coin" src="/assets/images/xeracoin-round.png" alt="" width="64" height="64" onerror="this.style.visibility='hidden'"/>
        <div class="hh-xera-body">
          <p class="hh-xera-label">XERA balance</p>
          <p class="hh-xera-balance"><b id="xeraCardBalance">&mdash;</b> <small>XERA</small></p>
          <span class="hh-xera-pill" id="xeraCardPill">Checking&hellip;</span>
        </div>
        <span class="hh-xera-chev" aria-hidden="true">&rsaquo;</span>
      </a>

      <!-- Phone-style icon grid: same icons as the Ecosystem page -->
      <h2 class="hub-section-title">Ecosystem</h2>
      <div class="hh-grid" id="hubAppGrid">
        <a class="hh-app" href="/xera"><span class="hh-tile" style="--c:#5b6cff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg><img src="/assets/images/xeracoin-round.png" alt="" width="64" height="64" decoding="async"></span><span class="hh-app-name">XERA</span></a>
        <a class="hh-app" href="/evosdata"><span class="hh-tile" style="--c:#12b886"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18v-3M9.3 18v-6M14.7 18v-9M20 18V4"/></svg><img src="/assets/images/evos-data.jpeg" alt="" width="64" height="64" decoding="async"></span><span class="hh-app-name">EVOS Data</span></a>
        <a class="hh-app" href="/evosgpt"><span class="hh-tile" style="--c:#f59f00"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"/><circle cx="12" cy="12" r="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg><img src="/assets/images/evosgpt.jpeg" alt="" width="64" height="64" decoding="async"></span><span class="hh-app-name">EVOSGPT</span></a>
        <a class="hh-app" href="/games/evolution-1-lanes/"><span class="hh-tile" style="--c:#e8590c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="5" r="2"/><path d="M5 21l4-7 3 2 2-5 4 3M9 14l-1-4 5-2"/></svg></span><span class="hh-app-name">Evolution 1</span></a>
        <a class="hh-app" href="/website-creation.html"><span class="hh-tile" style="--c:#1c7ed6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12.5h18"/></svg><img src="/assets/images/website-creation.jpeg" alt="" width="64" height="64" decoding="async"></span><span class="hh-app-name">Website Creation</span></a>
        <a class="hh-app hh-app--soon" href="#" aria-disabled="true" tabindex="-1"><span class="hh-tile" style="--c:#9c36b5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.5 3.4 5.5 3.4 9s-1 6.5-3.4 9c-2.4-2.5-3.4-5.5-3.4-9s1-6.5 3.4-9z"/></svg><img src="/assets/images/marketplace.jpeg" alt="" width="64" height="64" decoding="async"></span><span class="hh-app-name">Marketplace</span></a>
        <!-- admin-curated extras are appended here by hub-dashboard.js -->
      </div>

      <!-- Last 3 items only -->
      <h2 class="hub-section-title" id="activityTitle">Recent activity</h2>
      <section class="hub-panel hh-activity" id="activity" aria-label="Recent activity">
        <div id="activityList">
          <div class="hub-activity-row" style="border-bottom:0"><div class="hub-skel" style="width:100%;height:44px"></div></div>
        </div>
      </section>

      <!-- One support shortcut -->
      <a class="hh-support" href="https://wa.me/233537314125" target="_blank" rel="noopener">
        <span class="hh-support-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.6 8.6 0 0 1-3.4-.7L3 21l1.8-5.7A8.4 8.4 0 1 1 21 11.5Z" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Need help? Chat with us on WhatsApp</span>
      </a>
    </main>
  </div>

  <nav class="hub-bottom-nav" id="hubBottomNav" aria-label="EVOS Hub"></nav>
</div>

<script type="module" src="../../js/hub-dashboard.js"></script>
<script src="/hub-back.js" defer></script>
<script src="/product-switches.js" data-api="%VITE_API_BASE_URL%" defer></script>
</body>
</html>
