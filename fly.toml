# Fly.io config for the EVOS Business Hub / XERA Token FastAPI backend.
#
# This file being absent is why the previous deploy fell back to Fly's
# auto-detection, found the stray root-level requirements.txt (Flask),
# and tried `flask run` against an app that has no Flask code at all.
# With this file present, Fly builds from the explicit Dockerfile in
# python/ instead of guessing.

app = "evoshub"
primary_region = "iad"  # change to whichever region your Fly org already uses

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
