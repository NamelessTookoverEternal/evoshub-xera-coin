    #splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#8fe600,#c8ff3e);animation:spBar 1.1s ease-in-out infinite}
    #splash .pw{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font:600 11px/1 "Inter",system-ui,sans-serif;letter-spacing:1.2px;color:#7a6fa3;text-transform:uppercase;animation:spUp .6s .7s both}

    @keyframes spPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes spUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
    @keyframes spPulse{0%,100%{box-shadow:0 0 0 0 rgba(200,255,62,.30),0 18px 50px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 14px rgba(200,255,62,0),0 18px 50px rgba(0,0,0,.5)}}

    @keyframes spDrift{from{transform:translate(0,0)}to{transform:translate(4vmax,3vmax)}}
